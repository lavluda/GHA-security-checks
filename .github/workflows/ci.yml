name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test:coverage
      - name: Verify npm package contents
        run: npm run build && npm pack --dry-run

  action-yml-guard:
    name: Verify action manifests use __VERSION__ placeholder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check placeholder
        run: |
          status=0
          for f in action.yml docker/action.yml; do
            if grep -q '__VERSION__' "$f"; then
              echo "✅ $f contains __VERSION__ placeholder — ok"
            else
              echo "❌ $f must contain __VERSION__ as the image tag on main (not a pinned version)"
              echo "   The release workflow substitutes this at release time."
              status=1
            fi
          done
          exit "$status"

  docker-smoke:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: gha-security-checks:smoke
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container starts
        run: |
          docker run --rm --entrypoint node gha-security-checks:smoke \
            /app/dist/cli/index.js --version
