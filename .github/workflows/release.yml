name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, publish, and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.16.0

      - run: npm ci

      - name: Verify checks pass
        run: npm run lint && npm run check && npm run test

      - name: Extract and verify version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag version ($VERSION) does not match package.json version ($PKG_VERSION)"
            echo "   Bump package.json before tagging."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "✅ Version: $VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lavluda/gha-security-checks:${{ steps.version.outputs.version }}
            ghcr.io/lavluda/gha-security-checks:latest
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin image tag and digest in action manifests
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! echo "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "❌ Unexpected image digest: '$DIGEST'"
            exit 1
          fi
          for f in action.yml docker/action.yml; do
            sed -i "s|__VERSION__|${VERSION}@${DIGEST}|g" "$f"
            if grep -q '__VERSION__' "$f"; then
              echo "❌ __VERSION__ placeholder still present in $f"
              exit 1
            fi
            grep "image:" "$f"
          done

      - name: Commit pinned action manifests and retag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add action.yml docker/action.yml
          git commit -m "chore(release): pin action image to ${TAG} [skip ci]"
          git tag -f "$TAG"
          git push origin "$TAG" --force

      - name: Build npm package and JS action bundle
        run: npm run build && npm run prepare:action

      - name: Commit dist-action bundle
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git add dist-action/index.js dist-action/index.js.map dist-action/sourcemap-register.cjs dist-action/licenses.txt dist-action/package.json || true
          git diff --cached --quiet || git commit -m "chore(release): update dist-action bundle for ${TAG} [skip ci]"
          git tag -f "$TAG"
          git push origin "$TAG" --force

      - name: Publish to npm with trusted publishing
        run: npm publish

      - name: Verify published npm package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PUBLISHED_VERSION=""
          for attempt in {1..10}; do
            PUBLISHED_VERSION="$(npm view "gha-security-checks@${VERSION}" version 2>/dev/null || true)"
            [ "$PUBLISHED_VERSION" = "$VERSION" ] && break
            sleep 6
          done
          if [ "$PUBLISHED_VERSION" != "$VERSION" ]; then
            echo "Published npm version ($PUBLISHED_VERSION) does not match release version ($VERSION)"
            exit 1
          fi
          cd "$(mktemp -d)"
          npx --yes "gha-security-checks@${VERSION}" --version

      - name: Create GitHub release
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
